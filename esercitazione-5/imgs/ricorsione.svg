<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Avenir Next,Arial,sans-serif" font-size="15">
<rect width="900" height="470" fill="#fff"/>
<defs>
<marker id="giu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8fb5"/></marker>
<marker id="su" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9822b"/></marker>
</defs>
<text x="450" y="24" text-anchor="middle" fill="#17212b" font-weight="700" font-size="16">fattoriale(3): le chiamate scendono, i risultati risalgono</text>
<!-- risultato finale -->
<path d="M 600 70 V 40" stroke="#d9822b" stroke-width="2.5" marker-end="url(#su)" fill="none"/>
<text x="612" y="60" fill="#d9822b" font-weight="700">restituisce 6</text>
<!-- riquadri -->
<g stroke="#5d6770" stroke-width="1.5">
<rect x="220" y="70" width="440" height="64" rx="6" fill="#eef5fa"/>
<rect x="220" y="174" width="440" height="64" rx="6" fill="#eef5fa"/>
<rect x="220" y="278" width="440" height="64" rx="6" fill="#eef5fa"/>
<rect x="220" y="382" width="440" height="64" rx="6" fill="#fdf1e3"/>
</g>
<g font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">
<text x="236" y="96">fattoriale(3)</text>
<text x="236" y="200">fattoriale(2)</text>
<text x="236" y="304">fattoriale(1)</text>
<text x="236" y="408">fattoriale(0)</text>
</g>
<g fill="#17212b" font-size="14">
<text x="236" y="120">n = 3 · in attesa: 3 * fattoriale(2)</text>
<text x="236" y="224">n = 2 · in attesa: 2 * fattoriale(1)</text>
<text x="236" y="328">n = 1 · in attesa: 1 * fattoriale(0)</text>
<text x="236" y="432">n = 0 · caso base: nessuna chiamata</text>
</g>
<!-- frecce di chiamata (giù) -->
<g stroke="#4f8fb5" stroke-width="2.5" fill="none">
<path d="M 300 134 V 172" marker-end="url(#giu)"/>
<path d="M 300 238 V 276" marker-end="url(#giu)"/>
<path d="M 300 342 V 380" marker-end="url(#giu)"/>
</g>
<g fill="#4f8fb5" font-weight="700" text-anchor="end">
<text x="288" y="159">chiama</text>
<text x="288" y="263">chiama</text>
<text x="288" y="367">chiama</text>
</g>
<!-- frecce di ritorno (su) -->
<g stroke="#d9822b" stroke-width="2.5" fill="none">
<path d="M 600 380 V 342" marker-end="url(#su)"/>
<path d="M 600 276 V 238" marker-end="url(#su)"/>
<path d="M 600 172 V 134" marker-end="url(#su)"/>
</g>
<g fill="#d9822b" font-weight="700">
<text x="612" y="365">restituisce 1</text>
<text x="612" y="261">restituisce 1 * 1 = 1</text>
<text x="612" y="157">restituisce 2 * 1 = 2</text>
</g>
<!-- legenda -->
<text x="20" y="130" fill="#4f8fb5" font-weight="700">1 · si scende</text>
<text x="20" y="150" fill="#5d6770" font-size="13">le chiamate restano</text>
<text x="20" y="167" fill="#5d6770" font-size="13">in attesa</text>
<text x="20" y="400" fill="#d9822b" font-weight="700">2 · si risale</text>
<text x="20" y="420" fill="#5d6770" font-size="13">l'ultima chiamata</text>
<text x="20" y="437" fill="#5d6770" font-size="13">finisce per prima</text>
</svg>
