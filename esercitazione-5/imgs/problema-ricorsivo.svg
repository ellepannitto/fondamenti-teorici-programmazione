<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Avenir Next,Arial,sans-serif" font-size="15">
<rect width="900" height="410" fill="#fff"/>
<text x="450" y="24" text-anchor="middle" fill="#17212b" font-weight="700" font-size="16">conto(5): il suo output contiene l'output di conto(4), che contiene quello di conto(3), ...</text>
<rect x="20" y="40" width="860" height="316" rx="9" fill="#eef5fa" stroke="#5d6770" stroke-width="1.5"/>
<text x="34" y="67" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(5)</text>
<text x="150" y="67" fill="#5d6770" font-size="14">stampa 5, poi la soluzione di conto(4)</text>
<text x="866" y="67" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700"><tspan fill="#17212b">5 </tspan><tspan fill="#4f8fb5">4 3 2 1 Via!</tspan></text>
<rect x="44" y="82" width="812" height="262" rx="9" fill="#e6f0f8" stroke="#5d6770" stroke-width="1.5"/>
<text x="58" y="109" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(4)</text>
<text x="174" y="109" fill="#5d6770" font-size="14">stampa 4, poi la soluzione di conto(3)</text>
<text x="842" y="109" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700"><tspan fill="#17212b">4 </tspan><tspan fill="#4f8fb5">3 2 1 Via!</tspan></text>
<rect x="68" y="124" width="764" height="208" rx="9" fill="#dde9f4" stroke="#5d6770" stroke-width="1.5"/>
<text x="82" y="151" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(3)</text>
<text x="198" y="151" fill="#5d6770" font-size="14">stampa 3, poi la soluzione di conto(2)</text>
<text x="818" y="151" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700"><tspan fill="#17212b">3 </tspan><tspan fill="#4f8fb5">2 1 Via!</tspan></text>
<rect x="92" y="166" width="716" height="154" rx="9" fill="#d5e4f1" stroke="#5d6770" stroke-width="1.5"/>
<text x="106" y="193" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(2)</text>
<text x="222" y="193" fill="#5d6770" font-size="14">stampa 2, poi la soluzione di conto(1)</text>
<text x="794" y="193" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700"><tspan fill="#17212b">2 </tspan><tspan fill="#4f8fb5">1 Via!</tspan></text>
<rect x="116" y="208" width="668" height="100" rx="9" fill="#cce0ee" stroke="#5d6770" stroke-width="1.5"/>
<text x="130" y="235" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(1)</text>
<text x="246" y="235" fill="#5d6770" font-size="14">stampa 1, poi la soluzione di conto(0)</text>
<text x="770" y="235" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700"><tspan fill="#17212b">1 </tspan><tspan fill="#4f8fb5">Via!</tspan></text>
<rect x="140" y="250" width="620" height="46" rx="9" fill="#fdf1e3" stroke="#d9822b" stroke-width="2"/>
<text x="154" y="278" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#17212b">conto(0)</text>
<text x="270" y="278" fill="#d9822b" font-weight="700" font-size="14">caso base: nessuna chiamata</text>
<text x="746" y="278" text-anchor="end" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#d9822b">Via!</text>
<text x="450" y="382" text-anchor="middle" fill="#5d6770" font-size="13.5">A destra, l'output di ogni chiamata: in <tspan fill="#4f8fb5" font-weight="700">blu</tspan> la parte prodotta dalla chiamata più interna,</text>
<text x="450" y="402" text-anchor="middle" fill="#5d6770" font-size="13.5">cioè la soluzione dello stesso problema con un valore più piccolo («4 3 2 1 Via!», poi «3 2 1 Via!», ... fino a «Via!»).</text>
</svg>